name: ci

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          # The minor, at its newest patch, named here rather than read from go.mod: a
          # dependency can drag go.mod's line to an exact patch (sqlite did, to 1.25.0), and
          # setup-go then installs exactly that, which is how govulncheck failed the build on
          # stdlib fixes that shipped in 1.25.2. Keep this in step with go.mod and the
          # Dockerfile's golang:1.27-alpine.
          go-version: '1.27'
          check-latest: true
      - run: go vet ./...
      - run: go test -race ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    # Every push to the default branch moves :latest; a v* tag also publishes an image with
    # that version, so a self-hoster can pin one and upgrade on purpose.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # A large share of self-hosters are on ARM; an amd64-only image is a silent bounce.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
